<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 21px;
        font-weight: 500;
        fill: #111111;
        text-anchor: middle;
      }
      .state-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #111111;
        text-anchor: middle;
      }
      .callback-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 19px;
        font-weight: 500;
        fill: #111111;
        text-anchor: middle;
      }
      .box-blue {
        fill: #b4d2fa;
        stroke: #2b4c7e;
        stroke-width: 1.5;
      }
      .box-orange {
        fill: #fac378;
        stroke: #784b14;
        stroke-width: 1.5;
      }
      .line-solid {
        stroke: #b8bec4;
        stroke-width: 1.5;
      }
      .line-dashed {
        stroke: #b8bec4;
        stroke-width: 1.5;
        stroke-dasharray: 5, 6;
      }
      .arrow-shaft {
        stroke: #111111;
        stroke-width: 2;
      }
      .arrow-casing {
        stroke: #ffffff;
        stroke-width: 8;
      }
      .arrow-head {
        fill: #111111;
      }
    </style>
  </defs>

  
  <rect class="bg" x="0" y="0" width="800" height="1000" />

  
  <text class="header-text" x="122" y="32">Fragment Lifecycle</text>
  <text class="header-text" x="400" y="32">Fragment Callbacks</text>
  <text class="header-text" x="678" y="32">View Lifecycle</text>

  
  <line class="line-solid" x1="0" y1="48" x2="800" y2="48" />
  <line class="line-dashed" x1="256" y1="131" x2="800" y2="131" />
  <line class="line-dashed" x1="256" y1="289" x2="800" y2="289" />
  <line class="line-solid" x1="0" y1="380" x2="800" y2="380" />
  <line class="line-solid" x1="0" y1="471" x2="800" y2="471" />
  <line class="line-solid" x1="0" y1="561" x2="800" y2="561" />
  <line class="line-solid" x1="0" y1="651" x2="800" y2="651" />
  <line class="line-dashed" x1="256" y1="811" x2="800" y2="811" />
  <line class="line-solid" x1="0" y1="911" x2="800" y2="911" />

  
  <text class="state-text" x="122" y="221">CREATED</text>
  <text class="state-text" x="122" y="433">STARTED</text>
  <text class="state-text" x="122" y="523">RESUMED</text>
  <text class="state-text" x="122" y="613">STARTED</text>
  <text class="state-text" x="122" y="788">CREATED</text>
  <text class="state-text" x="122" y="963">DESTROYED</text>

  
  <text class="state-text" x="678" y="217">INITIALIZED</text>
  <text class="state-text" x="678" y="341">CREATED</text>
  <text class="state-text" x="678" y="433">STARTED</text>
  <text class="state-text" x="678" y="523">RESUMED</text>
  <text class="state-text" x="678" y="613">STARTED</text>
  <text class="state-text" x="678" y="738">CREATED</text>
  <text class="state-text" x="678" y="868">DESTROYED</text>

  
  
