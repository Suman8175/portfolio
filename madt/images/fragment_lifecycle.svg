  <line class="arrow-shaft" x1="400" y1="356" x2="400" y2="394" />
  <polygon class="arrow-head" points="400,403 394.5,392 405.5,392" />

  
  <line class="arrow-casing" x1="400" y1="450" x2="400" y2="484" />
  <line class="arrow-shaft" x1="400" y1="448" x2="400" y2="484" />
  <polygon class="arrow-head" points="400,493 394.5,482 405.5,482" />

  
  <line class="arrow-casing" x1="400" y1="540" x2="400" y2="574" />
  <line class="arrow-shaft" x1="400" y1="538" x2="400" y2="574" />
  <polygon class="arrow-head" points="400,583 394.5,572 405.5,572" />

  
  <line class="arrow-casing" x1="400" y1="630" x2="400" y2="664" />
  <line class="arrow-shaft" x1="400" y1="628" x2="400" y2="664" />
  <polygon class="arrow-head" points="400,673 394.5,662 405.5,662" />

  
  <line class="arrow-shaft" x1="400" y1="718" x2="400" y2="733" />
  <polygon class="arrow-head" points="400,742 394.5,731 405.5,731" />

  
  <line class="arrow-casing" x1="400" y1="790" x2="400" y2="824" />
  <line class="arrow-shaft" x1="400" y1="788" x2="400" y2="824" />
  <polygon class="arrow-head" points="400,833 394.5,822 405.5,822" />

  
  <line class="arrow-casing" x1="400" y1="880" x2="400" y2="924" />
  <line class="arrow-shaft" x1="400" y1="878" x2="400" y2="924" />
  <polygon class="arrow-head" points="400,933 394.5,922 405.5,922" />

  
  
  <rect class="box-blue" x="277" y="66" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="95">onCreate()</text>

  <rect class="box-blue" x="277" y="154" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="183">onCreateView()</text>

  <rect class="box-blue" x="277" y="224" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="253">onViewCreated()</text>

  <rect class="box-blue" x="277" y="312" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="341">onViewStateRestored()</text>

  <rect class="box-blue" x="277" y="404" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="433">onStart()</text>

  <rect class="box-blue" x="277" y="494" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="523">onResume()</text>

  
  <rect class="box-orange" x="277" y="584" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="613">onPause()</text>

  <rect class="box-orange" x="277" y="674" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="703">onStop()</text>

  <rect class="box-orange" x="277" y="744" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="773">onSaveInstanceState()</text>

  <rect class="box-orange" x="277" y="834" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="863">onDestroyView()</text>

  <rect class="box-orange" x="277" y="934" width="246" height="44" rx="6" ry="6" />
  <text class="callback-text" x="400" y="963">onDestroy()</text>
