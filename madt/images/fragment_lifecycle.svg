  <line class="arrow-shaft" x1="400" y1="110" x2="400" y2="144" />
  <polygon class="arrow-head" points="400,153 394.5,142 405.5,142" />

  
  <line class="arrow-shaft" x1="400" y1="198" x2="400" y2="213" />
  <polygon class="arrow-head" points="400,222 394.5,211 405.5,211" />

  
