<text x="285.0" y="502.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">being destroyed by the system</text>
<rect x="244" y="546" width="82" height="27" rx="9" fill="#d9dddf" stroke="#505050" stroke-width="2"/>
<text x="285.0" y="559.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#303030">onDestroy()</text>
