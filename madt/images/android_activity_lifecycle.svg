<text x="494.0" y="413.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">User navigates</text>
<text x="494.0" y="425.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">to the activity</text>
