<text x="285.0" y="617.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#303030">Activity shut down</text>
<rect x="29" y="230" width="132" height="36" rx="9" fill="#f5b39a" stroke="#505050" stroke-width="2"/>
<text x="95.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#303030">App process killed</text>
<rect x="47" y="161" width="84" height="40" rx="9" fill="white" stroke="#505050" stroke-width="2"/>
<text x="89.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">User navigates</text>
<text x="89.0" y="187.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">to the activity</text>
<rect x="32" y="334" width="125" height="40" rx="9" fill="white" stroke="#505050" stroke-width="2"/>
<text x="94.5" y="348.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">Apps with higher priority</text>
<text x="94.5" y="360.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">need memory</text>
<rect x="404" y="300" width="80" height="40" rx="9" fill="white" stroke="#505050" stroke-width="2"/>
<text x="444.0" y="314.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">User returns</text>
<text x="444.0" y="326.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#303030">to the activity</text>
